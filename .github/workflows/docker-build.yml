name: Publish application image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - name: Validate the application before publishing
        run: |
          uv sync --locked --python 3.12
          uv run --locked ruff check system_monitoring apps.py tests scripts
          uv run --locked ruff format --check system_monitoring apps.py tests scripts
          uv run --locked pytest -q
          docker build --tag system-monitoring:release .
          bash scripts/check-container.sh system-monitoring:release
      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Publish the reviewed image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag system-monitoring:release aryansharma04/systemmonitoring:$IMAGE_TAG
          docker push aryansharma04/systemmonitoring:$IMAGE_TAG
