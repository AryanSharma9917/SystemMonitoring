name: Application checks

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - name: Install Python and locked dependencies
        run: uv sync --locked --python 3.12
      - name: Check code quality
        run: |
          uv run --locked ruff check system_monitoring apps.py tests
          uv run --locked ruff format --check system_monitoring apps.py tests
      - name: Check application behavior
        run: uv run --locked pytest -q
      - name: Validate Compose configuration
        env:
          GRAFANA_ADMIN_PASSWORD: ci-configuration-validation-only
        run: docker compose config --quiet
      - name: Build the application image
        run: docker build --tag system-monitoring:ci .
      - name: Check container startup and persistent storage
        run: bash scripts/check-container.sh system-monitoring:ci
