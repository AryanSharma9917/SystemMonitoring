name: Application checks

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - name: Install Python and locked dependencies
        run: uv sync --locked --python 3.12
      - name: Check code quality
        run: |
          uv run --locked ruff check system_monitoring apps.py tests scripts
          uv run --locked ruff format --check system_monitoring apps.py tests scripts
      - name: Check application behavior
        run: uv run --locked pytest -q
      - name: Install Chromium for browser checks
        run: uv run --locked playwright install --with-deps chromium
      - name: Check the administrator workspace and alert delivery
        run: uv run --locked python scripts/check-browser.py --artifacts browser-artifacts
      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-workspace
          path: browser-artifacts/
      - name: Validate Compose configuration
        env:
          GRAFANA_ADMIN_PASSWORD: ci-configuration-validation-only
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f compose.demo.yml config --quiet
      - name: Build the application image
        run: docker build --tag system-monitoring:ci .
      - name: Check container startup and persistent storage
        run: bash scripts/check-container.sh system-monitoring:ci
      - name: Exercise scheduled outage detection and recovery
        env:
          MONITOR_ADMIN_PASSWORD: isolated-ci-operator-password
          GRAFANA_ADMIN_PASSWORD: isolated-ci-stack-only
          COMPOSE_PROJECT_NAME: monitoring-ci
        run: |
          docker tag system-monitoring:ci system-monitoring:local
          docker compose -f docker-compose.yml -f compose.demo.yml up --wait --wait-timeout 90 --no-build
          python scripts/demonstrate-outage.py
          python scripts/check-stack.py
      - name: Show stack logs after a failure
        if: failure()
        env:
          MONITOR_ADMIN_PASSWORD: isolated-ci-operator-password
          GRAFANA_ADMIN_PASSWORD: isolated-ci-stack-only
          COMPOSE_PROJECT_NAME: monitoring-ci
        run: docker compose -f docker-compose.yml -f compose.demo.yml logs --tail 80
      - name: Remove the isolated CI stack
        if: always()
        env:
          MONITOR_ADMIN_PASSWORD: isolated-ci-operator-password
          GRAFANA_ADMIN_PASSWORD: isolated-ci-stack-only
          COMPOSE_PROJECT_NAME: monitoring-ci
        run: docker compose -f docker-compose.yml -f compose.demo.yml down --volumes
