[project]
name = "system-monitoring"
version = "2.0.1"
description = "HTTP service monitoring and incident tracking."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.12,<4",
    "fastapi>=0.115,<1",
    "opentelemetry-api>=1.45.2,<1.46",
    "pydantic-settings>=2.6,<3",
    "prometheus-client>=0.21,<1",
    "starlette>=1.3.1,<1.4",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
retail = ["pandas>=2.2,<3", "scikit-learn>=1.5,<2"]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pip-audit>=2.10,<3",
    "playwright>=1.50,<2",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["system_monitoring"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
