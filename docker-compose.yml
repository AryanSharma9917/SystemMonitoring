services:
  fastapi:
    build: .
    image: system-monitoring:local
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      MONITOR_ADMIN_USERNAME: ${MONITOR_ADMIN_USERNAME:-admin}
      MONITOR_ADMIN_PASSWORD: ${MONITOR_ADMIN_PASSWORD:-}
      MONITOR_SECURE_COOKIES: ${MONITOR_SECURE_COOKIES:-false}
      MONITOR_SESSION_SECONDS: ${MONITOR_SESSION_SECONDS:-28800}
      MONITOR_WEBHOOK_URL: ${MONITOR_WEBHOOK_URL:-}
      MONITOR_WEBHOOK_ALLOW_PRIVATE: ${MONITOR_WEBHOOK_ALLOW_PRIVATE:-false}
      MONITOR_ENVIRONMENT: ${MONITOR_ENVIRONMENT:-development}
      MONITOR_LOG_LEVEL: ${MONITOR_LOG_LEVEL:-INFO}
      MONITOR_APPROVED_ORIGINS: ${MONITOR_APPROVED_ORIGINS:-[]}
      MONITOR_PRIVATE_ORIGINS: ${MONITOR_PRIVATE_ORIGINS:-[]}
      MONITOR_SCHEDULER_ENABLED: ${MONITOR_SCHEDULER_ENABLED:-true}
      MONITOR_CHECK_CONCURRENCY: ${MONITOR_CHECK_CONCURRENCY:-5}
      MONITOR_SERVICE_LIMIT: ${MONITOR_SERVICE_LIMIT:-100}
      MONITOR_HISTORY_PER_SERVICE: ${MONITOR_HISTORY_PER_SERVICE:-1000}
      MONITOR_DATABASE_PATH: /var/lib/system-monitoring/monitoring.sqlite3
    volumes:
      - application-data:/var/lib/system-monitoring
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  prometheus:
    # Prometheus 3.15.0, pinned to the verified image manifest.
    image: prom/prometheus@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  grafana:
    # Grafana 13.2.4, pinned to the verified image manifest.
    image: grafana/grafana@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  application-data:
  prometheus-data:
  grafana-data:
